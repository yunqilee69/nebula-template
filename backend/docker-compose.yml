services:
  postgres:
    image: postgres:16-alpine
    container_name: nebula-template-postgres
    environment:
      # 本机开发栈专用变量（NEBULA_LOCAL_*）：与应用的 NEBULA_APP_* 变量隔离，
      # 避免开发者 shell 里已导出的生产/远程连接信息（NEBULA_APP_DATASOURCE_* 等）
      # 被 compose 插值，导致容器用错账号或后端连到远程库。
      POSTGRES_DB: "${NEBULA_LOCAL_POSTGRES_DATABASE:-nebula}"
      POSTGRES_USER: "${NEBULA_LOCAL_POSTGRES_USER:-nebula}"
      POSTGRES_PASSWORD: "${NEBULA_LOCAL_POSTGRES_PASSWORD:-nebula}"
      TZ: Asia/Shanghai
    ports:
      - "${NEBULA_LOCAL_POSTGRES_PORT:-5432}:5432"
    volumes:
      - nebula-postgres-data:/var/lib/postgresql/data
      # 首次启动自动按文件名顺序导入初始化脚本（结构与数据 + Quartz 表）
      - ../docs/sql/init/postgresql/01-init-structure.sql:/docker-entrypoint-initdb.d/01-init-structure.sql:ro
      - ../docs/sql/init/postgresql/02-init-data.sql:/docker-entrypoint-initdb.d/02-init-data.sql:ro
      - ../docs/sql/init/postgresql/03-init-structure-quartz.sql:/docker-entrypoint-initdb.d/03-init-structure-quartz.sql:ro
    healthcheck:
      # -h 127.0.0.1 避开初始化阶段的临时实例（仅监听 unix socket），确保脚本执行完才放行应用
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7.2-alpine
    container_name: nebula-template-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${NEBULA_LOCAL_REDIS_PORT:-6379}:6379"
    volumes:
      - nebula-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  nebula-postgres-data:
  nebula-redis-data:
