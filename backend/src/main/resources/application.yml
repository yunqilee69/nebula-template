server:
  port: 8080
  tomcat:
    # 长文件名场景：默认 512B 容易触发上传失败
    max-part-header-size: 10KB

spring:
  application:
    name: nebula-template-backend
  servlet:
    multipart:
      # 静态传输口径（启动期装配，运行期不可改）：
      # 必须 >= 参数中心 storage.upload.max-file-size（默认 100MB），
      # 否则超限请求会在进入业务校验前被容器以 413 拒绝。
      # nebula-storage 启动时会自检该约束，不满足直接启动失败。
      max-file-size: 110MB
      max-request-size: 120MB
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.quartz.QuartzAutoConfiguration
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 默认值与 backend/docker-compose.yml 对齐，零配置即可本地启动；
    # 环境差异（生产凭据、微信 secret 等）通过 application-local.yml 覆盖（已 gitignore）
    url: jdbc:mysql://localhost:3306/nebula?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: nebula
    password: nebula
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      test-on-borrow: true
      test-while-idle: true
      validation-query: SELECT 1
  data:
    redis:
      host: localhost
      port: 6379
      database: 0

nebula:
  architecture:
    mode: local
  web:
    result-advice-enable: true
    # 跨域配置：默认关闭。浏览器端跨域访问（H5 / 移动端 WebView / 独立前端域名）时按需开启：
    # cors:
    #   allowed-origins:
    #     - http://localhost:8081
    #     - https://*.your-domain.com
    #   allow-credentials: true
  cache:
    type: redis
    default-ttl: 300
  scheduler:
    mode: local
    engine: quartz
    definition-sync:
      enabled: true
      startup-failure-policy: DEGRADED
  auth:
    mode: local
    oauth2:
      providers:
        github:
          enabled: false
          client-id:
          client-secret:
          scope: read:user user:email
          redirect-uri: http://localhost:8080/api/auth/github/callback
          frontend-callback-uri: http://localhost:5173/login/github-callback
          frontend-callback-allowlist:
            - http://localhost:5173
        wechat:
          # 运行时以系统参数 login.oauth2.provider.wechat.enabled 为准，此处仅承载凭据与接口地址
          enabled: false
          mini:
            app-id:
            app-secret:
          web:
            app-id:
            app-secret:
            redirect-uri:
            frontend-callback-uri: /login/wechat-callback
      bind:
        frontend-callback-uri: http://localhost:5173/profile/bind-callback
    security:
      jwt:
        # 本地开发默认值；生产环境必须在 application-local.yml 中覆盖（至少 32 字节随机串）
        secret: nebula-template-dev-jwt-secret-change-me-0123456789abcdef
        expire-hours: 24
        refresh-expire-hours: 168
      captcha:
        enabled: false
      rate-limit:
        enabled: false
    code:
      # 手机/邮箱验证码发送器：框架只提供 VerificationCodeSender 扩展点，
      # 业务工程实现该接口并注册为 Bean 即可对接短信/邮件网关。
      # 未注册发送器时发送验证码会失败；本地联调可临时开启此项，把验证码打到日志（生产禁用）。
      log-enabled: false
  storage:
    mode: local
    # 临时区：上传过程中的文件与分片，落各操作系统临时目录下的 nebula 子目录
    temp-dir: ${java.io.tmpdir}/nebula
    # 正式区：绑定成功后文件内容写入 storage_content 表
    content:
      type: db

org:
  quartz:
    scheduler:
      instanceName: nebula-template-quartz
      instanceId: AUTO
    threadPool:
      class: org.quartz.simpl.SimpleThreadPool
      threadCount: 5
      threadPriority: 5
    jobStore:
      class: org.quartz.impl.jdbcjobstore.JobStoreTX
      driverDelegateClass: org.quartz.impl.jdbcjobstore.StdJDBCDelegate
      useProperties: false
      tablePrefix: QRTZ_
      dataSource: nebulaQuartzDS
      isClustered: false
      misfireThreshold: 60000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      table-underline: true
      id-type: assign_uuid
      logic-delete-field: deleted
      logic-not-delete-value: "false"
      logic-delete-value: "true"
  mapper-locations: classpath*:mapper/**/*.xml

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
